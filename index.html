<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kanakkupulla — Smart Financial Ledger</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='28' fill='%234f46e5'/%3E%3Cpath d='M30 25h45a5 5 0 0 1 5 5v40a5 5 0 0 1-5 5H30a5 5 0 0 1-5-5V30a5 5 0 0 1 5-5z' fill='none' stroke='white' stroke-width='6'/%3E%3Cpath d='M25 38h55M45 25v50' stroke='%2334d399' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='62' cy='55' r='6' fill='%23fbbf24'/%3E%3C/svg%3E">

<style>
:root {
  --bg-core: #f8fafc;
  --bg-card: #ffffff;
  --bg-subcard: #f1f5f9;
  --primary: #4f46e5;
  --primary-glow: rgba(79, 70, 229, 0.2);
  --success: #059669;
  --danger: #e11d48;
  --warning: #d97706;
  --info: #0284c7;
  --purple: #7c3aed;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --radius: 14px;
  --shadow: 0 4px 18px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background-color: var(--bg-core); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
.app-container { width: 100%; max-width: 480px; min-height: 100vh; background: var(--bg-core); position: relative; padding-bottom: 100px; }

header { padding: 16px 20px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
.brand-wrapper { display: flex; align-items: center; gap: 10px; }
.brand-icon { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #4f46e5, #6366f1); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px var(--primary-glow); }
.brand { font-size: 1.2rem; font-weight: 800; background: linear-gradient(135deg, #3730a3, #6d28d9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }

.dashboard { padding: 16px 20px; }
.balance-card { background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%); color: white; padding: 20px; border-radius: var(--radius); text-shadow: 0 2px 4px rgba(0,0,0,0.12); box-shadow: 0 10px 24px var(--primary-glow); margin-bottom: 14px; position: relative; overflow: hidden; }
.balance-card span { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; font-weight: 700; }
.balance-card h2 { font-size: 2.2rem; margin: 4px 0 12px 0; font-weight: 800; letter-spacing: -1px; }

.fund-split-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; background: rgba(0, 0, 0, 0.2); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); }
.fund-split-item small { font-size: 0.65rem; opacity: 0.85; text-transform: uppercase; display: block; font-weight: 700; }
.fund-split-item strong { font-size: 0.9rem; font-weight: 700; }
.fund-split-item.liquid strong { color: #6ee7b7; }
.fund-split-item.locked strong { color: #e9d5ff; }
.fund-split-item.receivable strong { color: #fde047; }

.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.summary-box { background: var(--bg-card); border: 1px solid var(--border); padding: 12px 14px; border-radius: var(--radius); box-shadow: var(--shadow); }
.summary-box h4 { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; font-weight: 700; }
.summary-box p { font-size: 1.1rem; font-weight: 800; }
.summary-box.income p { color: var(--success); }
.summary-box.expense p { color: var(--danger); }

.analytics-trigger-btn { width: 100%; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 13px; border-radius: var(--radius); font-weight: 700; font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow); }

.section-title-wrapper { display: flex; justify-content: space-between; align-items: center; margin: 20px 20px 10px 20px; }
.section-title { font-size: 0.75rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

.transaction-list { padding: 0 20px; }
.transaction-item { background: var(--bg-card); border: 1px solid var(--border); padding: 12px 14px; border-radius: var(--radius); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); cursor: pointer; position: relative; overflow: hidden; }
.transaction-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--primary); }
.transaction-item.expense::before { background: var(--danger); }
.transaction-item.income::before { background: var(--success); }
.transaction-item.savings::before { background: var(--info); }
.transaction-item.investment::before { background: var(--purple); }
.transaction-item.lend::before { background: var(--warning); }
.transaction-item.borrow::before { background: #db2777; }

.t-info h4 { font-size: 0.9rem; margin-bottom: 3px; font-weight: 700; color: var(--text-main); }
.t-info p { font-size: 0.72rem; color: var(--text-muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.badge { background: #f1f5f9; padding: 2px 6px; border-radius: 6px; font-size: 0.68rem; color: var(--text-muted); border: 1px solid var(--border); font-weight: 600; }
.t-amount { font-weight: 800; font-size: 1rem; }
.t-amount.expense { color: var(--danger); }
.t-amount.income { color: var(--success); }
.t-amount.savings { color: var(--info); }
.t-amount.investment { color: var(--purple); }
.t-amount.lend { color: var(--warning); }

.fab { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; background: linear-gradient(135deg, #4f46e5, #4338ca); color: white; border-radius: 30px; display: flex; justify-content: center; align-items: center; font-size: 2rem; box-shadow: 0 8px 20px var(--primary-glow); cursor: pointer; z-index: 999; border: none; }

.modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
.modal-content { background: var(--bg-card); width: 100%; max-width: 480px; max-height: 90vh; border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); border-top: 1px solid var(--border); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 1.05rem; font-weight: 800; color: var(--text-main); }
.close-btn { background: #f1f5f9; border: 1px solid var(--border); width: 30px; height: 30px; border-radius: 15px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }

.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 0.75rem; margin-bottom: 4px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.form-control { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; background: #f8fafc; color: var(--text-main); outline: none; }
.form-control:focus { border-color: var(--primary); background: #ffffff; }
select.form-control { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; }

.math-hint { font-size: 0.72rem; color: var(--primary); margin-top: 3px; font-weight: 700; display: none; }
.btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, #4f46e5, #4338ca); color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 6px; box-shadow: 0 6px 16px var(--primary-glow); }
.btn-danger { background: var(--danger); box-shadow: 0 6px 16px rgba(225, 29, 72, 0.2); }

.inline-cat-box { display: flex; gap: 6px; }
.add-inline-cat-btn { width: 44px; height: 44px; background: #f1f5f9; border: 1px solid var(--border); border-radius: 10px; font-size: 1.2rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

.report-section { margin-bottom: 18px; }
.report-section h4 { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 800; border-bottom: 1px solid var(--border); padding-bottom: 4px; }

.tracker-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
.tracker-card h5 { font-size: 0.88rem; font-weight: 800; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.tracker-amt { font-size: 0.95rem; font-weight: 800; color: var(--primary); }

.mode-breakdown-list { margin-top: 6px; border-top: 1px dashed var(--border); padding-top: 6px; }
.mode-breakdown-item { display: flex; justify-content: space-between; font-size: 0.76rem; color: var(--text-muted); padding: 2px 0; font-weight: 600; }
.mode-breakdown-item span.mode-val { color: var(--text-main); font-weight: 700; }

.empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 0.85rem; line-height: 1.5; }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="brand-wrapper">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          <line x1="12" y1="6" x2="12" y2="12"/>
          <line x1="15" y1="9" x2="9" y2="9"/>
        </svg>
      </div>
      <div class="brand">Kanakkupulla</div>
    </div>
  </header>

  <div class="dashboard">
    <div class="balance-card">
      <span>Total Net Wealth</span>
      <h2 id="total-balance">₹0.00</h2>

      <div class="fund-split-row">
        <div class="fund-split-item liquid">
          <small>Liquid Savings</small>
          <strong id="liquid-funds-val">₹0.00</strong>
        </div>
        <div class="fund-split-item locked">
          <small>Investments</small>
          <strong id="locked-funds-val">₹0.00</strong>
        </div>
        <div class="fund-split-item receivable">
          <small>Owed to You</small>
          <strong id="receivable-funds-val">₹0.00</strong>
        </div>
      </div>
    </div>

    <div class="summary-grid">
      <div class="summary-box income">
        <h4>Total Income</h4>
        <p id="total-income">₹0.00</p>
      </div>
      <div class="summary-box expense">
        <h4>Total Expenses</h4>
        <p id="total-expense">₹0.00</p>
      </div>
    </div>

    <button class="analytics-trigger-btn" id="btn-open-analytics">
      📊 View Detailed Complete Financial Report
    </button>
  </div>

  <div class="section-title-wrapper">
    <div class="section-title">Recent Transactions</div>
  </div>
  <div class="transaction-list" id="transaction-list"></div>

  <button class="fab" id="fab-add">+</button>
</div>

<!-- Add Entry Modal -->
<div class="modal" id="addModal">
  <div class="modal-content">
    <div class="modal-header">
      <span>New Entry</span>
      <button class="close-btn" id="close-add-modal">&times;</button>
    </div>
    <form id="add-form">
      <div class="form-group">
        <label>Amount (₹)</label>
        <!-- Mobile Numeric Keypad Trigger -->
        <input type="text" id="amount" class="form-control" inputmode="decimal" pattern="[0-9\+\-\*\/\.]*" autocomplete="off" required placeholder="0.00">
        <div class="math-hint" id="math-hint">Evaluates to: ₹<span id="math-eval-val">0.00</span></div>
      </div>

      <div class="form-group">
        <label>Type</label>
        <select id="type" class="form-control">
          <option value="expense">Regular Expense / Bill</option>
          <option value="income">Income / Credit</option>
          <option value="savings">Savings (Goal / Bucket)</option>
          <option value="investment">Investment (Asset / Stocks / FD)</option>
          <option value="lend">Lending (Money Owed to You)</option>
          <option value="borrow">Borrowing (Money You Owe)</option>
        </select>
      </div>

      <!-- Income Extra Field: Mode/Source -->
      <div id="income-extra-fields" style="display:none;">
        <div class="form-group">
          <label>Income Mode / Source</label>
          <input type="text" id="income-source" class="form-control" placeholder="e.g. Salary Account, Freelance Client, Cash">
        </div>
      </div>

      <!-- Dynamic Extra Fields for Custom Savings -->
      <div id="savings-extra-fields" style="display:none;">
        <div class="form-group">
          <label>Savings Purpose / Goal Name</label>
          <input type="text" id="savings-goal-name" class="form-control" placeholder="e.g. Emergency Fund, New Scooter">
        </div>
        <div class="form-group">
          <label>Saving Mode / Account for this entry</label>
          <input type="text" id="savings-mode" class="form-control" placeholder="e.g. Liquid Cash, RD, HDFC Auto-Sweep">
        </div>
      </div>

      <!-- Dynamic Extra Fields for Custom Investment -->
      <div id="investment-extra-fields" style="display:none;">
        <div class="form-group">
          <label>Investment Purpose / Asset Name</label>
          <input type="text" id="inv-name" class="form-control" placeholder="e.g. Nifty 50 Index, SGB Gold, Child Education">
        </div>
        <div class="form-group">
          <label>Investment Mode / Platform for this entry</label>
          <input type="text" id="inv-mode" class="form-control" placeholder="e.g. Zerodha, Groww, Post Office, SIP">
        </div>
      </div>

      <div class="form-group">
        <label>Category</label>
        <div class="inline-cat-box">
          <select id="category" class="form-control"></select>
          <button type="button" class="add-inline-cat-btn" id="btn-quick-cat" title="Add New Category">+</button>
        </div>
      </div>

      <div class="form-group">
        <label>Title / Note</label>
        <input type="text" id="desc" class="form-control" required placeholder="e.g. Monthly Savings, Groceries, Loan to Friend">
      </div>

      <div class="form-group">
        <label>Date</label>
        <input type="date" id="date" class="form-control" required>
      </div>

      <button type="submit" class="btn-primary">Save Entry</button>
    </form>
  </div>
</div>

<!-- Details Modal -->
<div class="modal" id="detailsModal">
  <div class="modal-content">
    <div class="modal-header">
      <span>Entry Details</span>
      <button class="close-btn" id="close-details-modal">&times;</button>
    </div>
    <div id="details-content">
      <h2 id="det-amount" style="font-size:1.8rem; margin-bottom:2px">₹0.00</h2>
      <p id="det-desc" style="font-size:1rem; font-weight:700; color:var(--text-main)"></p>
      <p id="det-meta" style="font-size:0.75rem; color:var(--text-muted); margin-bottom:14px"></p>
      <p id="det-extra" style="font-size:0.8rem; color:var(--primary); font-weight:600; margin-bottom:14px"></p>
      <button type="button" id="btn-delete-record" class="btn-primary btn-danger">Delete Entry</button>
    </div>
  </div>
</div>

<!-- Portfolio Breakdown Modal -->
<div class="modal" id="analyticsModal">
  <div class="modal-content" style="max-height:85vh;">
    <div class="modal-header">
      <span>Complete Financial Report</span>
      <button class="close-btn" id="close-analytics-modal">&times;</button>
    </div>
    <div id="analytics-report-body"></div>
  </div>
</div>

<script>
let transactions = [];
let categories = ['Food & Dining', 'Groceries', 'Utilities & Bills', 'Rent', 'Shopping', 'Transport', 'Salary & Income', 'Liquid Savings', 'Investments', 'Lending/Receivable', 'Miscellaneous'];

try {
  const saved = localStorage.getItem('native_tracker_data');
  if (saved) transactions = JSON.parse(saved);
  const savedCats = localStorage.getItem('native_tracker_cats');
  if (savedCats) categories = JSON.parse(savedCats);
} catch(e) { transactions = []; }

let currentViewId = null;

function saveData() {
  try {
    localStorage.setItem('native_tracker_data', JSON.stringify(transactions));
    localStorage.setItem('native_tracker_cats', JSON.stringify(categories));
  } catch(e) {}
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('date').valueAsDate = new Date();

  updateUI();
  populateCategoryDropdown();

  document.getElementById('fab-add').onclick = () => openModal('addModal');
  document.getElementById('close-add-modal').onclick = () => closeModal('addModal');
  document.getElementById('close-details-modal').onclick = () => closeModal('detailsModal');
  document.getElementById('close-analytics-modal').onclick = () => closeModal('analyticsModal');
  document.getElementById('btn-open-analytics').onclick = openAnalyticsReport;

  document.getElementById('btn-quick-cat').onclick = handleQuickAddCategory;
  document.getElementById('add-form').onsubmit = handleFormSubmit;
  document.getElementById('btn-delete-record').onclick = deleteTransaction;

  const typeSelect = document.getElementById('type');
  typeSelect.onchange = toggleDynamicFields;

  // Amount Math Evaluator & Numeric Input Listener
  const amountField = document.getElementById('amount');
  const mathHint = document.getElementById('math-hint');
  const mathEvalVal = document.getElementById('math-eval-val');

  amountField.oninput = (e) => {
    const valStr = e.target.value;
    try {
      if (/^[\d\+\-\*\/\.\s]+$/.test(valStr)) {
        const computed = Function(`'use strict'; return (${valStr})`)();
        if (computed !== undefined && !isNaN(computed) && valStr.trim() !== '') {
          mathEvalVal.innerText = computed.toFixed(2);
          mathHint.style.display = 'block';
          return;
        }
      }
    } catch(err) {}
    mathHint.style.display = 'none';
  };
});

function toggleDynamicFields() {
  const type = document.getElementById('type').value;
  const incBox = document.getElementById('income-extra-fields');
  const savingsBox = document.getElementById('savings-extra-fields');
  const invBox = document.getElementById('investment-extra-fields');

  incBox.style.display = type === 'income' ? 'block' : 'none';
  savingsBox.style.display = type === 'savings' ? 'block' : 'none';
  invBox.style.display = type === 'investment' ? 'block' : 'none';
}

function populateCategoryDropdown(selectedCat = null) {
  const select = document.getElementById('category');
  if (!select) return;
  select.innerHTML = '';
  categories.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.innerText = cat;
    select.appendChild(opt);
  });
  if (selectedCat) select.value = selectedCat;
}

function handleQuickAddCategory() {
  const newCat = prompt("Enter new category name:");
  if (newCat && newCat.trim() !== "") {
    const cleanCat = newCat.trim();
    if (!categories.includes(cleanCat)) {
      categories.push(cleanCat);
      saveData();
      populateCategoryDropdown(cleanCat);
    } else {
      document.getElementById('category').value = cleanCat;
    }
  }
}

function updateUI() {
  const listEl = document.getElementById('transaction-list');
  const balanceEl = document.getElementById('total-balance');
  const liquidFundsEl = document.getElementById('liquid-funds-val');
  const lockedFundsEl = document.getElementById('locked-funds-val');
  const receivableFundsEl = document.getElementById('receivable-funds-val');
  const incomeEl = document.getElementById('total-income');
  const expenseEl = document.getElementById('total-expense');

  listEl.innerHTML = '';

  let totalExp = 0, totalInc = 0, totalLiquidSavings = 0, totalLockedInvestments = 0, totalLentOut = 0;

  if (transactions.length === 0) {
    listEl.innerHTML = '<div class="empty-state">No records logged yet.<br>Tap [+] below to add an entry.</div>';
  }

  const sorted = [...transactions].sort((a,b) => new Date(b.date) - new Date(a.date));

  sorted.forEach(t => {
    if (t.type === 'expense') totalExp += t.amount;
    if (t.type === 'income') totalInc += t.amount;
    if (t.type === 'savings') totalLiquidSavings += t.amount;
    if (t.type === 'investment') totalLockedInvestments += t.amount;
    if (t.type === 'lend') totalLentOut += t.amount; // Money given out to get back
    if (t.type === 'borrow') totalExp += t.amount;

    const div = document.createElement('div');
    div.className = `transaction-item ${t.type}`;
    div.onclick = () => openDetails(t.id);

    const isOutflow = ['expense', 'lend'].includes(t.type);
    const prefix = isOutflow ? '-' : '+';
    let extraLabel = '';
    if (t.type === 'income' && t.incomeSource) extraLabel = ` • 📥 ${t.incomeSource}`;
    if (t.type === 'savings' && t.savingsGoal) extraLabel = ` • 🎯 ${t.savingsGoal} (${t.savingsMode || 'General'})`;
    if (t.type === 'investment' && t.invName) extraLabel = ` • 📈 ${t.invName} (${t.invMode || 'General'})`;

    div.innerHTML = `
      <div class="t-info">
        <h4>${escapeHtml(t.desc)}</h4>
        <p><span>${t.date}</span><span class="badge">${escapeHtml(t.category || 'General')}</span><span>${escapeHtml(extraLabel)}</span></p>
      </div>
      <div class="t-amount ${t.type}">${prefix}₹${t.amount.toFixed(2)}</div>
    `;
    listEl.appendChild(div);
  });

  const liquidBalance = (totalInc + totalLiquidSavings) - totalExp;
  const netWorth = liquidBalance + totalLockedInvestments + totalLentOut;

  balanceEl.innerText = `₹${netWorth.toFixed(2)}`;
  liquidFundsEl.innerText = `₹${liquidBalance.toFixed(2)}`;
  lockedFundsEl.innerText = `₹${totalLockedInvestments.toFixed(2)}`;
  receivableFundsEl.innerText = `₹${totalLentOut.toFixed(2)}`;
  incomeEl.innerText = `₹${totalInc.toFixed(2)}`;
  expenseEl.innerText = `₹${totalExp.toFixed(2)}`;
}

function openModal(id) {
  document.getElementById(id).style.display = 'flex';
}
function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}

function handleFormSubmit(e) {
  e.preventDefault();
  const rawAmountStr = document.getElementById('amount').value;
  let finalAmount = 0;
  try {
    if (/^[\d\+\-\*\/\.\s]+$/.test(rawAmountStr)) {
      finalAmount = Function(`'use strict'; return (${rawAmountStr})`)();
    }
  } catch(err) {
    finalAmount = parseFloat(rawAmountStr) || 0;
  }

  const type = document.getElementById('type').value;

  const newRecord = {
    id: Date.now(),
    amount: finalAmount,
    type: type,
    category: document.getElementById('category').value,
    desc: document.getElementById('desc').value,
    date: document.getElementById('date').value,
    incomeSource: type === 'income' ? (document.getElementById('income-source').value.trim() || 'General Income') : null,
    savingsGoal: type === 'savings' ? (document.getElementById('savings-goal-name').value.trim() || 'General Savings') : null,
    savingsMode: type === 'savings' ? (document.getElementById('savings-mode').value.trim() || 'Liquid Cash') : null,
    invName: type === 'investment' ? (document.getElementById('inv-name').value.trim() || 'General Investment') : null,
    invMode: type === 'investment' ? (document.getElementById('inv-mode').value.trim() || 'Platform') : null,
  };

  transactions.push(newRecord);
  saveData();

  document.getElementById('add-form').reset();
  document.getElementById('date').valueAsDate = new Date();
  document.getElementById('math-hint').style.display = 'none';
  toggleDynamicFields();
  closeModal('addModal');
  updateUI();
}

function openDetails(id) {
  currentViewId = id;
  const t = transactions.find(x => x.id === id);
  if (!t) return;

  document.getElementById('det-amount').innerText = `₹${t.amount.toFixed(2)}`;
  document.getElementById('det-desc').innerText = t.desc;
  
  let typeTitle = t.type.toUpperCase();
  if (t.type === 'lend') typeTitle = 'LENDING (MONEY OWED TO YOU)';
  document.getElementById('det-meta').innerText = `${t.date} • ${typeTitle} • ${t.category || 'General'}`;

  let extraText = '';
  if (t.incomeSource) extraText = `Source/Mode: ${t.incomeSource}`;
  if (t.savingsGoal) extraText = `Goal: ${t.savingsGoal} | Mode: ${t.savingsMode || 'Unspecified'}`;
  if (t.invName) extraText = `Asset: ${t.invName} | Platform/Mode: ${t.invMode || 'Unspecified'}`;
  document.getElementById('det-extra').innerText = extraText;

  openModal('detailsModal');
}

function deleteTransaction() {
  if (confirm("Permanently delete this entry?")) {
    transactions = transactions.filter(x => x.id !== currentViewId);
    saveData();
    closeModal('detailsModal');
    updateUI();
  }
}

// Complete Financial Breakdown Report Generator
function openAnalyticsReport() {
  const body = document.getElementById('analytics-report-body');
  if (!body) return;

  const categoryExpenses = {};
  const incomeSources = {};
  const savingsData = {}; // { Purpose: { total: X, modes: { ModeA: Y, ModeB: Z } } }
  const invData = {};     // { Asset: { total: X, modes: { PlatformA: Y, PlatformB: Z } } }

  transactions.forEach(t => {
    if (t.type === 'expense') {
      const cat = t.category || 'Uncategorized';
      categoryExpenses[cat] = (categoryExpenses[cat] || 0) + t.amount;
    }
    if (t.type === 'income') {
      const src = t.incomeSource || 'General Income';
      incomeSources[src] = (incomeSources[src] || 0) + t.amount;
    }
    if (t.type === 'savings') {
      const purpose = t.savingsGoal || 'General Savings';
      const mode = t.savingsMode || 'Liquid Cash';
      if (!savingsData[purpose]) savingsData[purpose] = { total: 0, modes: {} };
      savingsData[purpose].total += t.amount;
      savingsData[purpose].modes[mode] = (savingsData[purpose].modes[mode] || 0) + t.amount;
    }
    if (t.type === 'investment') {
      const purpose = t.invName || 'General Investment';
      const mode = t.invMode || 'Platform';
      if (!invData[purpose]) invData[purpose] = { total: 0, modes: {} };
      invData[purpose].total += t.amount;
      invData[purpose].modes[mode] = (invData[purpose].modes[mode] || 0) + t.amount;
    }
  });

  let html = '';

  // 1. Expense Breakdown by Category
  html += `<div class="report-section"><h4>💸 Expense Breakdown by Category</h4>`;
  if (Object.keys(categoryExpenses).length === 0) {
    html += '<div class="tracker-card"><p style="font-size:0.75rem; color:var(--text-muted)">No expenses recorded yet.</p></div>';
  } else {
    Object.entries(categoryExpenses).forEach(([cat, val]) => {
      html += `
        <div class="tracker-card">
          <h5><span>${escapeHtml(cat)}</span> <span class="tracker-amt" style="color:var(--danger)">₹${val.toFixed(2)}</span></h5>
        </div>
      `;
    });
  }
  html += `</div>`;

  // 2. Income Breakdown by Source/Mode
  html += `<div class="report-section"><h4>📥 Income Breakdown by Source</h4>`;
  if (Object.keys(incomeSources).length === 0) {
    html += '<div class="tracker-card"><p style="font-size:0.75rem; color:var(--text-muted)">No income recorded yet.</p></div>';
  } else {
    Object.entries(incomeSources).forEach(([src, val]) => {
      html += `
        <div class="tracker-card">
          <h5><span>${escapeHtml(src)}</span> <span class="tracker-amt" style="color:var(--success)">₹${val.toFixed(2)}</span></h5>
        </div>
      `;
    });
  }
  html += `</div>`;

  // 3. Savings Purpose & Mode Breakdown
  html += `<div class="report-section"><h4>🎯 Savings Saved by Purpose & Mode</h4>`;
  if (Object.keys(savingsData).length === 0) {
    html += '<div class="tracker-card"><p style="font-size:0.75rem; color:var(--text-muted)">No custom savings entries logged yet.</p></div>';
  } else {
    Object.entries(savingsData).forEach(([purpose, pData]) => {
      let modeListHtml = '';
      Object.entries(pData.modes).forEach(([mode, mVal]) => {
        modeListHtml += `
          <div class="mode-breakdown-item">
            <span>Mode: ${escapeHtml(mode)}</span>
            <span class="mode-val">₹${mVal.toFixed(2)}</span>
          </div>
        `;
      });

      html += `
        <div class="tracker-card">
          <h5><span>${escapeHtml(purpose)}</span> <span class="tracker-amt" style="color:var(--info)">₹${pData.total.toFixed(2)}</span></h5>
          <div class="mode-breakdown-list">
            ${modeListHtml}
          </div>
        </div>
      `;
    });
  }
  html += `</div>`;

  // 4. Investment Purpose & Mode Breakdown
  html += `<div class="report-section"><h4>📈 Investment Assets & Platform Breakdown</h4>`;
  if (Object.keys(invData).length === 0) {
    html += '<div class="tracker-card"><p style="font-size:0.75rem; color:var(--text-muted)">No investments logged yet.</p></div>';
  } else {
    Object.entries(invData).forEach(([purpose, pData]) => {
      let modeListHtml = '';
      Object.entries(pData.modes).forEach(([mode, mVal]) => {
        modeListHtml += `
          <div class="mode-breakdown-item">
            <span>Platform/Mode: ${escapeHtml(mode)}</span>
            <span class="mode-val">₹${mVal.toFixed(2)}</span>
          </div>
        `;
      });

      html += `
        <div class="tracker-card">
          <h5><span>${escapeHtml(purpose)}</span> <span class="tracker-amt" style="color:var(--purple)">₹${pData.total.toFixed(2)}</span></h5>
          <div class="mode-breakdown-list">
            ${modeListHtml}
          </div>
        </div>
      `;
    });
  }
  html += `</div>`;

  body.innerHTML = html;
  openModal('analyticsModal');
}

function escapeHtml(str) {
  if (!str) return '';
  return str.toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
